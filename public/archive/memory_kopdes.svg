<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_kopdes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190b13"/>
      <stop offset="100%" stop-color="#0a0407"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg_kopdes)"/>
  <circle cx="300" cy="200" r="150" fill="#e11d48" opacity="0.14"/>
  <!-- Neon Sign Style for Kopdes Tongkrongan -->
  <rect x="180" y="90" width="240" height="80" rx="16" fill="rgba(225,29,72,0.12)" stroke="#e11d48" stroke-width="3"/>
  <text x="300" y="140" fill="#ffffff" font-family="'Syne', sans-serif" font-weight="800" font-size="28" text-anchor="middle" letter-spacing="3">KOPI DESA</text>
  <text x="300" y="158" fill="#fb7185" font-family="monospace" font-size="10" text-anchor="middle" letter-spacing="2">// BASECAMP KOBRAT //</text>
  <!-- Coffee Bean & Chill Iconography -->
  <ellipse cx="300" cy="250" rx="45" ry="32" fill="#be123c"/>
  <path d="M300 220 Q285 250 300 280" stroke="#180710" stroke-width="4" fill="none"/>
  <!-- Music Waves / Vibe -->
  <g transform="translate(190, 310)" stroke="#fb7185" stroke-width="3" stroke-linecap="round">
    <line x1="20" y1="30" x2="20" y2="50" />
    <line x1="40" y1="20" x2="40" y2="60" />
    <line x1="60" y1="10" x2="60" y2="70" />
    <line x1="80" y1="25" x2="80" y2="55" />
    <line x1="100" y1="15" x2="100" y2="65" />
    <line x1="120" y1="20" x2="120" y2="60" />
    <line x1="140" y1="30" x2="140" y2="50" />
    <line x1="160" y1="10" x2="160" y2="70" />
    <line x1="180" y1="25" x2="180" y2="55" />
    <line x1="200" y1="35" x2="200" y2="45" />
  </g>
  <rect x="40" y="40" width="130" height="30" rx="6" fill="rgba(225,29,72,0.15)" stroke="rgba(225,29,72,0.3)"/>
  <text x="105" y="60" fill="#fb7185" font-family="monospace" font-weight="bold" font-size="11" text-anchor="middle">KOBRAT ARCHIVE #03</text>
  <text x="300" y="415" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">TEMPAT LAHIRNYA DISKUSI & IDE GILA KOBRAT</text>
</svg>
